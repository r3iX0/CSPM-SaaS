<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudGuard API Reference & Interactive Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .meta {
      font-size: 0.875rem;
      color: #8b949e;
    }
    .header a {
      color: #58a6ff;
      text-decoration: none;
    }
    .header a:hover {
      text-decoration: underline;
    }
    .badge {
      font-size: 0.75rem;
      background: #238636;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
    }
    /* Swagger UI Dark Mode Adaptations */
    .swagger-ui {
      filter: invert(88%) hue-rotate(180deg);
      padding: 20px;
    }
    .swagger-ui .topbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>🛡️ CloudGuard API</span>
      <span class="badge">v0.1.0</span>
    </h1>
    <div class="meta">
      Auto-generated from FastAPI &bull;
      <a href="./openapi.json" download="openapi.json">Download OpenAPI JSON</a> &bull;
      <a href="../API.md">API Design Doc</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
