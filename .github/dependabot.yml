# Keeps the pins moving.
#
# Every dependency in this repository is pinned exactly, which is the right
# default for a deployment -- and which means nothing updates unless somebody
# updates it. Without this file the set installed in production is whatever was
# current on the day it was written, and CI's audit job would eventually be the
# first thing to notice.
#
# Security updates are separated from the weekly batch because they should not
# wait for it, and grouping keeps the routine ones to one pull request per
# ecosystem rather than one per package.
version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: monthly
