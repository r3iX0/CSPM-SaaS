# Keeps the pins moving.
#
# Every dependency in this repository is pinned exactly, which is the right
# default for a deployment -- and which means nothing updates unless somebody
# updates it. Without this file the set installed in production is whatever was
# current on the day it was written, and CI's audit job would eventually be the
# first thing to notice.
#
# Security updates are separated from the weekly batch because they should not
# wait for it, and grouping keeps the routine ones to one pull request per
# ecosystem rather than one per package.
#
# Every ecosystem waits seven days after a release before a version is offered.
# A compromised release is usually pulled within days, and a pin that moves the
# morning something ships is the one that takes it. Security updates ignore the
# cooldown, so a fix for a known advisory is not held back.
version: 2

updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Patch releases of the base image only. Moving to a newer Python is done by hand,
    # with CI's python-version, after every pinned wheel exists for it (DECISIONS.md §197).
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
