name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudguard
          POSTGRES_PASSWORD: cloudguard
          POSTGRES_DB: cloudguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      # RLS tests need the non-owner role, exactly as production does -- running
      # them as the owner would silently pass while proving nothing.
      DATABASE_URL: postgresql+asyncpg://cloudguard_app:cloudguard_app@localhost:5432/cloudguard
      DATABASE_OWNER_URL: postgresql+asyncpg://cloudguard:cloudguard@localhost:5432/cloudguard
      # Set here so the integration tests exercise the constrained path. Left
      # unset, the worker falls back to the owner connection, which bypasses
      # RLS -- so the tests that prove the worker cannot reach another tenant
      # would pass while proving nothing.
      DATABASE_WORKER_URL: postgresql+asyncpg://cloudguard_worker:cloudguard_worker@localhost:5432/cloudguard
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_JWT_SECRET: ci-test-secret
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Refuse a real credential in the Supabase role template
        # That file is meant to be edited in Supabase's SQL Editor, not saved
        # with a live password. Committing one here would publish a database
        # credential to a public repository.
        run: |
          grep -q "CHANGE-ME-BEFORE-RUNNING" infrastructure/supabase/roles.sql || {
            echo "::error file=infrastructure/supabase/roles.sql::Placeholder password was replaced. Restore it and keep the real password only in Railway's DATABASE_URL."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The same libraries the API image installs. Without them the report
      # tests would import WeasyPrint, fail at dlopen, and prove nothing about
      # the PDF path that production actually runs.
      - name: Install WeasyPrint's native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8

      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create the RLS-constrained application role
        env:
          PGPASSWORD: cloudguard
        run: psql -h localhost -U cloudguard -d cloudguard -f infrastructure/ci/postgres-roles.sql

      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head

      - name: Refuse a drifted Graph permission manifest
        # The deployed app registration is generated from
        # REQUIRED_GRAPH_PERMISSIONS, and the file under infrastructure/ is what
        # actually gets applied. If the two disagree, the permission a new rule
        # needs is one no customer has ever been asked to grant -- and the
        # symptom is a 403 inside one collection category, months later.
        working-directory: apps/api
        run: |
          python -c "import json; from app.connectors.azure.auth import app_registration_manifest; print(json.dumps(app_registration_manifest(), indent=2))" > /tmp/manifest.json
          diff -u ../../infrastructure/azure/app-registration.json /tmp/manifest.json || {
            echo "::error file=infrastructure/azure/app-registration.json::Out of date. Regenerate it and re-run infrastructure/azure/apply-app-registration.sh, then have every connected tenant consent again."
            exit 1
          }

      - name: Refuse drifted documentation (OpenAPI schema & Rule Catalog)
        # Keeps documentation synchronized with code. If an API route, schema,
        # or security rule changes without updating docs/api/openapi.json or
        # docs/RULE_CATALOG.md, fail the build here.
        working-directory: apps/api
        run: |
          python scripts/generate_openapi.py --check || {
            echo "::error file=docs/api/openapi.json::OpenAPI documentation is out of date. Run python apps/api/scripts/generate_openapi.py to update."
            exit 1
          }
          python scripts/generate_rule_catalog.py --check || {
            echo "::error file=docs/RULE_CATALOG.md::Rule Catalog is out of date. Run python apps/api/scripts/generate_rule_catalog.py to update."
            exit 1
          }

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Type check
        working-directory: apps/api
        run: mypy app

      - name: Test
        working-directory: apps/api
        run: pytest -q

  web:
    name: Web — lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Refuse drifted deployment headers
        # Vercel reads whichever vercel.json matches the project's Root
        # Directory, and this repository carries two. The headers used to be in
        # only one of them, so a deployment from the repository root shipped the
        # frontend with no CSP and no HSTS and said nothing about it.
        run: node infrastructure/ci/check-deployment-headers.mjs

      - name: Install
        working-directory: apps/web
        # ci, not install: it installs exactly the locked tree Vercel will build
        # from, so a lockfile that drifted out of sync fails here rather than
        # surfacing as a confusing deploy error.
        run: npm ci

      # Ahead of the type check because it is the faster of the two. It is
      # also the step that was missing: `npm run lint` pointed at a config that
      # did not exist for long enough that ESLint itself fell out of the
      # dependencies, and nothing caught it because nothing ran it.
      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

  audit:
    name: Dependencies — known advisories
    runs-on: ubuntu-latest
    # Its own job on purpose. It shares nothing with the two above -- no
    # database, no native libraries, no build -- and keeping it separate means a
    # new advisory reports as "dependencies" rather than as the test suite
    # failing for a reason the tests had nothing to do with.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Audit Python dependencies
        working-directory: apps/api
        # Audits the pinned set rather than the installed tree: every version is
        # exact in pyproject.toml, so what is resolved here is what Railway
        # deploys. --strict fails on an advisory this cannot rule out, which is
        # the answer a security product should want.
        #
        # The --ignore-vuln list is a triage backlog, not a dismissal. Each one
        # needs an upgrade that crosses a major version and has to be run
        # against the test suite before it ships:
        #
        #   starlette     -- needs FastAPI past 0.115, which pins starlette <0.42
        #   cryptography  -- capped by msal 1.31; bumping msal releases it
        #   weasyprint    -- 63 -> 70 changes PDF rendering; the report tests
        #                    assert on rendered output
        #   pytest        -- 8 -> 9, a test-only dependency
        #
        # Anything *not* on this list fails the build, which is the point: the
        # list is what a new advisory is measured against, and it should only
        # ever get shorter. Reviewed in docs/SECURITY_AUDIT_2026-09.md section 6.
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.7.3"
          pip-audit --strict --progress-spinner off . \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln PYSEC-2026-36 \
            --ignore-vuln PYSEC-2026-2141 \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-2034 \
            --ignore-vuln PYSEC-2026-3412 \
            --ignore-vuln PYSEC-2026-3940 \
            --ignore-vuln PYSEC-2026-1845

      - name: Audit npm dependencies
        working-directory: apps/web
        # High and above. Moderate advisories in a build-time dependency tree
        # are common enough that failing on them trains people to ignore this
        # job, which costs more than it saves.
        run: npm audit --audit-level=high
