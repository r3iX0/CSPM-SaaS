<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cleave</title>
    <!-- The brand's cut mark. Without a declared icon the browser asked for
         /favicon.ico, which does not exist, on every load (DECISIONS.md §189). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The theme, before the first paint (public/theme-init.js). A file rather
      than an inline script, because the CSP allows scripts from 'self' only.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
