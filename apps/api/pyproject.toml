[project]
name = "cloudguard-api"
version = "0.1.0"
description = "CloudGuard - Azure-first CSPM. Modular monolith API + worker."
requires-python = ">=3.12"

dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic[email]==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.1",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "celery[redis]==5.6.3",
  "redis==5.2.1",
  "httpx==0.28.1",
  # Pinned directly rather than left to Starlette's ">=3.4,<5": two limiters
  # (reports, graph work) are created at import, outside any running loop,
  # which only a 4.x release allows (DECISIONS.md sections 158, 161).
  "anyio==4.15.1",
  "pyjwt==2.15.0",
  "msal==1.39.0",
  # AWS. The connector stores the provider's own response verbatim, exactly as
  # the Azure one does -- what this handles is the layer beneath that, which
  # Azure does not have: SigV4, and three different wire protocols across the
  # services CloudGuard reads (DECISIONS.md §72).
  "aiobotocore==3.9.1",
  "structlog==24.4.0",
  "sentry-sdk[fastapi]==2.70.0",
  "jinja2==3.1.6",
  # PDF reports. Needs native pango/cairo/harfbuzz, installed in the API image
  # and in CI; app.reports.render imports it lazily so a machine without them
  # can still render, and test, the HTML the PDF is printed from.
  "weasyprint==63.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.16.9",
  "mypy==1.14.0",
  "respx==0.23.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI Depends() in argument defaults is the documented idiom
  "N818",  # domain errors read better as NotFound / PermissionDenied than *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = "^(database/|tests/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "integration: requires a live PostgreSQL database",
]
